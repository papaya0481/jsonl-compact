name: Bug report
description: Report a parsing, display, or navigation problem.
title: "[Bug]: "
body:
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: VS Code version, operating system, and local or remote workspace.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the file type, relevant settings, and the actions that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal JSONL example
      description: Use synthetic or anonymized data that reproduces the problem.
      render: json
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe both; screenshots are useful for display issues.
    validations:
      required: true
